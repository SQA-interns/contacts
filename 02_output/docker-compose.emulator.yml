# Adds the Firebase Authentication emulator (development and tests only, never shipped, ADR-15).
services:
  emulator:
    build: ./emulator
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
    ports:
      - "127.0.0.1:9099:9099"
  backend:
    depends_on:
      - emulator
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: emulator:9099
  frontend:
    environment:
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
